name: Product Dogfood V1 Live

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Authentication path for the live dogfood run
        required: true
        type: choice
        options:
          - api_key
          - codex_home
      model:
        description: Exact Codex model id for all 20 Normal/Bounded pairs
        required: true
        type: string

permissions:
  contents: read

jobs:
  api-key-live:
    if: ${{ inputs.auth_mode == 'api_key' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DOGFOOD_MODEL: ${{ inputs.model }}
      DOGFOOD_EVIDENCE: ${{ runner.temp }}/product-dogfood-v1-live.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Fail-closed live auth preflight
        run: |
          node benchmarks/product-v1/dogfood-auth-preflight.cjs \
            --mode=api_key \
            --model="${DOGFOOD_MODEL}" \
            --runner-environment="${{ runner.environment }}"

      - id: live-run
        name: Run 20 fresh Normal/Bounded dogfood pairs
        continue-on-error: true
        env:
          BOUNDED_CODEX_MODEL: ${{ env.DOGFOOD_MODEL }}
        run: |
          node benchmarks/product-v1/dogfood-runner.cjs \
            --live \
            --model="${DOGFOOD_MODEL}" \
            --output="${DOGFOOD_EVIDENCE}"

      - name: Enforce P7.2 live completion gate
        if: always()
        run: |
          node benchmarks/product-v1/dogfood-live-gate.cjs \
            --input="${DOGFOOD_EVIDENCE}"

      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-dogfood-v1-live-api-key
          path: ${{ runner.temp }}/product-dogfood-v1-live.json
          if-no-files-found: error
          retention-days: 30

  codex-home-live:
    if: ${{ inputs.auth_mode == 'codex_home' }}
    runs-on: self-hosted
    timeout-minutes: 240
    env:
      CODEX_API_KEY: ""
      OPENAI_API_KEY: ""
      DOGFOOD_MODEL: ${{ inputs.model }}
      DOGFOOD_EVIDENCE: ${{ runner.temp }}/product-dogfood-v1-live.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Fail-closed pre-authenticated Codex preflight
        run: |
          node benchmarks/product-v1/dogfood-auth-preflight.cjs \
            --mode=codex_home \
            --model="${DOGFOOD_MODEL}" \
            --runner-environment="${{ runner.environment }}"

      - id: live-run
        name: Run 20 fresh Normal/Bounded dogfood pairs
        continue-on-error: true
        env:
          BOUNDED_CODEX_MODEL: ${{ env.DOGFOOD_MODEL }}
        run: |
          node benchmarks/product-v1/dogfood-runner.cjs \
            --live \
            --model="${DOGFOOD_MODEL}" \
            --output="${DOGFOOD_EVIDENCE}"

      - name: Enforce P7.2 live completion gate
        if: always()
        run: |
          node benchmarks/product-v1/dogfood-live-gate.cjs \
            --input="${DOGFOOD_EVIDENCE}"

      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-dogfood-v1-live-codex-home
          path: ${{ runner.temp }}/product-dogfood-v1-live.json
          if-no-files-found: error
          retention-days: 30
