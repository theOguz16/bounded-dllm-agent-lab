name: P7.7 Journal Offline Integration
on:
  pull_request:
    types: [opened, synchronize]
    branches: [product/p7-4-human-decision-capture]
    paths: ['.github/workflows/p7-7-journal-once.yml', 'scripts/product/p7-7-legacy-smoke-update.cjs']
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'product/p7-7-after-p7-6-review' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEX_API_KEY: ''
      OPENAI_API_KEY: ''
      CODEX_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Wire the existing adapter to the transactional invocation authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node scripts/product/p7-7-journal-wire.cjs
          node scripts/product/p7-7-legacy-smoke-update.cjs
          git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify integrated P7.6 and P7.7 without credentials
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          node scripts/smoke/p7-7-invocation-journal-smoke.cjs
          node scripts/smoke/p7-7-worker-termination-smoke.cjs
          node scripts/smoke/p7-7-codex-adapter-worker-smoke.cjs
          node benchmarks/product-v1/p7-7-compare-worker-stop-smoke.cjs
          node benchmarks/product-v1/p7-6-codex-provider-smoke.cjs
          node benchmarks/product-v1/p7-6-compare-provider-smoke.cjs
          node benchmarks/product-v1/dogfood-smoke.cjs
      - name: Commit verified integration only to the P7.7 draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && { echo 'No integration changes staged'; exit 1; }
          git commit -m 'feat(P7.7): durably reserve provider calls and deny crash replay'
          git push origin HEAD:refs/heads/product/p7-7-after-p7-6-review
