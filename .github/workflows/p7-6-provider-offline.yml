name: P7.6 Provider Offline

on:
  pull_request:
    paths:
      - "packages/integrations/src/**"
      - "packages/product-runtime/src/agent-comparison-contract.ts"
      - "apps/cli/src/commands/compare.ts"
      - "apps/cli/src/commands/codex-compare-provider-gate.ts"
      - "benchmarks/product-v1/provider-access*.cjs"
      - "benchmarks/product-v1/p7-6-*.cjs"
      - "benchmarks/product-v1/dogfood-*.cjs"
      - "scripts/smoke/agent-output-redaction-smoke.cjs"
      - ".github/workflows/p7-6-provider-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_API_KEY: ""
      OPENAI_API_KEY: ""
      CODEX_ACCESS_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck and build (no provider invocation)
        run: |
          npm run typecheck
          npm run build
      - name: Deterministic fake-provider and comparison smokes (no paid calls)
        run: |
          node benchmarks/product-v1/provider-access-smoke.cjs
          node benchmarks/product-v1/p7-6-codex-provider-smoke.cjs
          node benchmarks/product-v1/p7-6-compare-provider-smoke.cjs
          node benchmarks/product-v1/p7-6-compare-command-smoke.cjs
          node scripts/smoke/agent-comparison-contract-smoke.cjs
          node scripts/smoke/codex-agent-adapter-smoke.cjs
          node scripts/smoke/agent-output-redaction-smoke.cjs
          node benchmarks/product-v1/dogfood-smoke.cjs
