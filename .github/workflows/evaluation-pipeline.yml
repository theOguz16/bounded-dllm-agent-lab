name: Evaluation Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify evaluation pipeline
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MODEL_ACCEPTANCE_REQUIRED: "0"
      GITHUB_PR_FETCH_REQUIRED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare report directories
        run: |
          mkdir -p reports/real-repo-evaluation
          mkdir -p reports/baseline-comparison
          mkdir -p reports/model-worker-contract
          mkdir -p reports/model-worker-acceptance
          mkdir -p reports/github-pr-live
          mkdir -p reports/dllm-verifier
          mkdir -p reports/evaluation-integrated
          mkdir -p reports/evaluation-case-level

      - name: Show available npm scripts
        run: npm run

      - name: Run full verification
        run: npm run verify:all

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: reports/**
          if-no-files-found: warn
          retention-days: 14
