name: Evaluation Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify evaluation pipeline
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MODEL_ACCEPTANCE_REQUIRED: "0"
      GITHUB_PR_FETCH_REQUIRED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run full verification
        run: npm run verify:all

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            reports/real-repo-evaluation/**
            reports/baseline-comparison/**
            reports/model-worker-contract/**
            reports/model-worker-acceptance/**
            reports/github-pr-live/**
            reports/dllm-verifier/**
            reports/evaluation-integrated/**
            reports/evaluation-case-level/**
          if-no-files-found: warn
          retention-days: 14
