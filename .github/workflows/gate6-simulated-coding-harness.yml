name: Gate 6 simulated coding harness

on:
  pull_request:
    paths:
      - '.github/workflows/gate6-simulated-coding-harness.yml'
      - 'scripts/lib/gate6-simulated-coding-harness.cjs'
      - 'scripts/lib/gate6-simulated-workspace.cjs'
      - 'tests/gate6/simulated-coding-harness.test.cjs'
      - 'bounded-agent.policy.yml'
  push:
    branches:
      - agent/gate6-simulated-coding-harness
    paths:
      - '.github/workflows/gate6-simulated-coding-harness.yml'
      - 'scripts/lib/gate6-simulated-coding-harness.cjs'
      - 'scripts/lib/gate6-simulated-workspace.cjs'
      - 'tests/gate6/simulated-coding-harness.test.cjs'
      - 'bounded-agent.policy.yml'

permissions:
  contents: write

jobs:
  simulated-coding-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check scripts/lib/gate6-simulated-workspace.cjs
          node --check scripts/lib/gate6-simulated-coding-harness.cjs
          node --check tests/gate6/simulated-coding-harness.test.cjs
      - name: Run Gate 6 simulated coding harness regression
        continue-on-error: true
        run: node tests/gate6/simulated-coding-harness.test.cjs
      - name: Correct test-double map iteration on branch
        if: github.event_name == 'push'
        run: |
          sed -i 's/for (const filePath of baseline) if (!files.has(filePath))/for (const filePath of baseline.keys()) if (!files.has(filePath))/' tests/gate6/simulated-coding-harness.test.cjs
          if git diff --quiet -- tests/gate6/simulated-coding-harness.test.cjs; then
            echo 'Test double already corrected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/gate6/simulated-coding-harness.test.cjs
          git commit -m 'Gate 6: fix simulated workspace test double'
          git push origin HEAD:agent/gate6-simulated-coding-harness
