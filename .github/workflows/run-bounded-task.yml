name: Run Bounded Task

on:
  pull_request:
    paths:
      - "packages/product-runtime/src/run-bounded-task.ts"
      - "packages/product-runtime/src/canonical-runtime.ts"
      - "packages/product-runtime/src/**"
      - "packages/product-runtime/package.json"
      - "package-lock.json"
      - "action.yml"
      - "scripts/run-bounded-task-smoke.cjs"
      - ".github/workflows/run-bounded-task.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Prepare pinned Docker test image
        env:
          BOUNDED_TASK_TEST_IMAGE: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
        run: |
          set -euo pipefail
          docker pull "$BOUNDED_TASK_TEST_IMAGE"
          resolved="$(docker image inspect "$BOUNDED_TASK_TEST_IMAGE" --format '{{index .RepoDigests 0}}')"
          test -n "$resolved"
          echo "BOUNDED_TASK_TEST_IMAGE=$resolved" >> "$GITHUB_ENV"
      - run: node scripts/run-bounded-task-smoke.cjs
