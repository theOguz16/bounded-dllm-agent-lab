name: P7.6 One-shot Compare Revision
on:
  push:
    branches:
      - product/p7-6-provider-access-fail-closed
    paths:
      - .github/workflows/p7-6-apply-revision.yml
permissions:
  contents: write
jobs:
  apply-once:
    if: github.repository == 'theOguz16/bounded-dllm-agent-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_API_KEY: ""
      OPENAI_API_KEY: ""
      CODEX_ACCESS_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/p7-6-provider-access-fail-closed
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply hash-guarded source patch
        run: node benchmarks/product-v1/p7-6-apply-revision.cjs
      - run: npm ci
      - name: Compile and test without provider credentials
        run: |
          npm run typecheck
          npm run build
          node benchmarks/product-v1/provider-access-smoke.cjs
          node benchmarks/product-v1/p7-6-codex-provider-smoke.cjs
          node benchmarks/product-v1/p7-6-compare-provider-smoke.cjs
          node scripts/smoke/agent-comparison-contract-smoke.cjs
      - name: Commit only compare source when offline checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/cli/src/commands/compare.ts
          git diff --cached --quiet && exit 1
          git commit -m 'fix(P7.6): enforce provider identity and stop opposite compare arm'
          git push origin HEAD:refs/heads/product/p7-6-provider-access-fail-closed
