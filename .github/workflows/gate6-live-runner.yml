name: Gate 6 live runner

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gate6-live-runner.cjs'
      - 'scripts/gate6-live-runner-v3.cjs'
      - 'scripts/gate6-live-runner-v1.cjs'
      - 'scripts/gate6-live-runner-core.cjs'
      - 'scripts/lib/gate6-live-provider-contract.cjs'
      - 'scripts/lib/gate6-live-validator-contract.cjs'
      - 'scripts/lib/gate6-proposal-validation-diagnostics.cjs'
      - 'scripts/lib/gate6-live-checkpoint.cjs'
      - 'scripts/lib/gate6-live-checkpoint-v1.cjs'
      - 'scripts/lib/gate6-selection-validation-diagnostics.cjs'
      - 'tests/gate6/live-runner.test.cjs'
      - 'tests/gate6/live-runner-structured-output.test.cjs'
      - 'tests/gate6/live-runner-diagnostics.test.cjs'
      - 'tests/gate6/live-runner-selection-diagnostics.test.cjs'
      - 'tests/gate6/live-runner-checkpoint.test.cjs'
      - 'tests/gate6/live-runner-provider-contract.test.cjs'
      - 'tests/gate6/live-runner-provider-selection-semantics-v3.test.cjs'
      - 'tests/gate6/live-runner-contract-hardening-v1.test.cjs'
      - 'tests/gate6/live-provider-contract-hash-pin.test.cjs'
      - 'tests/gate6/live-validator-contract-hash-pin.test.cjs'
      - 'tests/gate6/proposal-validation-diagnostics.test.cjs'
      - 'tests/gate6/provider-validator-contract-drift.test.cjs'
      - 'tests/gate6/adversarial-provider-contract-matrix.test.cjs'
      - 'tests/gate6/contract-identity-checkpoint-binding.test.cjs'
      - 'bounded-agent.policy.yml'
      - '.github/workflows/gate6-live-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live runner syntax
        run: |
          node --check scripts/gate6-live-runner.cjs
          node --check scripts/gate6-live-runner-v3.cjs
          node --check scripts/gate6-live-runner-v1.cjs
          node --check scripts/gate6-live-runner-core.cjs
          node --check scripts/lib/gate6-live-provider-contract.cjs
          node --check scripts/lib/gate6-live-validator-contract.cjs
          node --check scripts/lib/gate6-proposal-validation-diagnostics.cjs
          node --check scripts/lib/gate6-live-checkpoint.cjs
          node --check scripts/lib/gate6-live-checkpoint-v1.cjs
          node --check scripts/lib/gate6-selection-validation-diagnostics.cjs
          node --check tests/gate6/live-runner.test.cjs
          node --check tests/gate6/live-runner-structured-output.test.cjs
          node --check tests/gate6/live-runner-diagnostics.test.cjs
          node --check tests/gate6/live-runner-selection-diagnostics.test.cjs
          node --check tests/gate6/live-runner-checkpoint.test.cjs
          node --check tests/gate6/live-runner-provider-contract.test.cjs
          node --check tests/gate6/live-runner-provider-selection-semantics-v3.test.cjs
          node --check tests/gate6/live-runner-contract-hardening-v1.test.cjs
          node --check tests/gate6/live-provider-contract-hash-pin.test.cjs
          node --check tests/gate6/live-validator-contract-hash-pin.test.cjs
          node --check tests/gate6/proposal-validation-diagnostics.test.cjs
          node --check tests/gate6/provider-validator-contract-drift.test.cjs
          node --check tests/gate6/adversarial-provider-contract-matrix.test.cjs
          node --check tests/gate6/contract-identity-checkpoint-binding.test.cjs
      - name: Gate 6 live runner fake-provider smoke
        run: node tests/gate6/live-runner.test.cjs
      - name: Gate 6 llama.cpp structured-output compatibility regressions
        run: node tests/gate6/live-runner-structured-output.test.cjs
      - name: Gate 6 live diagnostic provenance regressions
        run: node tests/gate6/live-runner-diagnostics.test.cjs
      - name: Gate 6 Step 17 selection validation diagnostics v2 regressions
        run: node tests/gate6/live-runner-selection-diagnostics.test.cjs
      - name: Gate 6 crash-safe checkpoint and resume regressions
        run: node tests/gate6/live-runner-checkpoint.test.cjs
      - name: Gate 6 explicit provider output contract v3 regressions
        run: node tests/gate6/live-runner-provider-contract.test.cjs
      - name: Gate 6 Step 18 provider selection semantics v3 regressions
        run: node tests/gate6/live-runner-provider-selection-semantics-v3.test.cjs
      - name: Gate 6 Live Contract Hardening v1 regressions
        run: node tests/gate6/live-runner-contract-hardening-v1.test.cjs
      - name: Gate 6 Step 19 proposal validation diagnostics
        run: node tests/gate6/proposal-validation-diagnostics.test.cjs
      - name: Gate 6 Step 19 provider validator contract drift
        run: node tests/gate6/provider-validator-contract-drift.test.cjs
      - name: Gate 6 Step 19 adversarial provider contract matrix
        run: node tests/gate6/adversarial-provider-contract-matrix.test.cjs
      - name: Gate 6 Step 19 contract identity checkpoint binding
        run: node tests/gate6/contract-identity-checkpoint-binding.test.cjs
      - name: Gate 6 canonical provider contract hash pin
        run: node tests/gate6/live-provider-contract-hash-pin.test.cjs
      - name: Gate 6 canonical validator contract hash pin
        run: node tests/gate6/live-validator-contract-hash-pin.test.cjs
      - name: Gate 6 frozen verifier remains green
        run: node scripts/gate6-verify.cjs
