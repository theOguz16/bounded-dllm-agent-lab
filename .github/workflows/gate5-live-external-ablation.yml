name: Gate 5 Live External Ablation

on:
  pull_request:
    paths:
      - 'scripts/gate5-live-external-ablation-runner.cjs'
      - '.github/workflows/gate5-live-external-ablation.yml'
  workflow_dispatch:

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/gate5-live-external-ablation-runner.cjs --output=reports/gate5/live-external-ablation-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate5-live-external-ablation-fixture
          path: reports/gate5/live-external-ablation-fixture.json
