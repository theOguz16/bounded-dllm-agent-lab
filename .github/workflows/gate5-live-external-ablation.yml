name: Gate 5 Live External Ablation

on:
  pull_request:
    paths:
      - 'scripts/gate5-live-external-ablation-runner.cjs'
      - 'scripts/gate5-multi-external-benchmark.cjs'
      - 'scripts/gate5-external-patch-e2e.cjs'
      - 'scripts/gate5-adaptive-compressed-boundary.cjs'
      - 'scripts/gate5-mode-f-live-evidence.cjs'
      - 'scripts/gate5-mode-f-promotion-gate.cjs'
      - 'scripts/lib/gate5-language-resolver.cjs'
      - '.github/workflows/gate5-live-external-ablation.yml'
  workflow_dispatch:

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/gate5-live-external-ablation-runner.cjs --output=reports/gate5/live-external-ablation-fixture.json
      - run: node scripts/gate5-multi-external-benchmark.cjs --repetitions=3 --output=reports/gate5/multi-external-benchmark-fixture.json
      - run: node scripts/gate5-external-patch-e2e.cjs --output=reports/gate5/external-patch-e2e-fixture.json
      - run: node --check scripts/lib/gate5-language-resolver.cjs
      - run: node --check scripts/gate5-adaptive-compressed-boundary.cjs
      - run: node --check scripts/gate5-mode-f-live-evidence.cjs
      - run: node --check scripts/gate5-mode-f-promotion-gate.cjs
      - run: node scripts/gate5-adaptive-compressed-boundary.cjs --repetitions=3 --output=reports/gate5/adaptive-compressed-boundary-fixture.json
      - run: node scripts/gate5-mode-f-live-evidence.cjs --repetitions=3 --output=reports/gate5/mode-f-fixture-evidence.json
      - run: node scripts/gate5-mode-f-promotion-gate.cjs --evidence=reports/gate5/mode-f-fixture-evidence.json --output=reports/gate5/mode-f-fixture-promotion-decision.json
      - run: node -e "const d=require('./reports/gate5/mode-f-fixture-promotion-decision.json'); if(d.promotionEligible!==false || !d.reasons.includes('live_observed_evidence_required')) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: gate5-external-benchmark-fixtures
          path: |
            reports/gate5/live-external-ablation-fixture.json
            reports/gate5/multi-external-benchmark-fixture.json
            reports/gate5/external-patch-e2e-fixture.json
            reports/gate5/adaptive-compressed-boundary-fixture.json
            reports/gate5/mode-f-fixture-evidence.json
            reports/gate5/mode-f-fixture-evidence.json.raw.json
            reports/gate5/mode-f-fixture-promotion-decision.json
