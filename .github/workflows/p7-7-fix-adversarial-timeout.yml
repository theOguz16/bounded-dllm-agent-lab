name: P7.7 One-shot Adversarial Timeout Fix
on:
  push:
    branches:
      - product/p7-7-worker-deadline-termination
    paths:
      - benchmarks/product-v1/p7-7-fix-adversarial-timeout.cjs
      - .github/workflows/p7-7-fix-adversarial-timeout.yml
permissions:
  contents: write
jobs:
  apply-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_API_KEY: ""
      OPENAI_API_KEY: ""
      CODEX_ACCESS_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/p7-7-worker-deadline-termination
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node benchmarks/product-v1/p7-7-fix-adversarial-timeout.cjs
      - run: npm ci
      - name: Verify deterministic product suite
        run: npm run product:v1-check
      - name: Commit only the repaired adversarial test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/product/adversarial-agent-suite.cjs
          git diff --cached --quiet && exit 1
          git commit -m 'test(P7.7): expect ambiguous provider outcome in adversarial timeout'
          git push origin HEAD:refs/heads/product/p7-7-worker-deadline-termination
