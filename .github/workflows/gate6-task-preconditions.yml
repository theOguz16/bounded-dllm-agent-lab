name: Gate 6 task preconditions

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/gate6/**'
      - 'scripts/gate6-precondition-runner.cjs'
      - 'scripts/lib/gate6-precondition-probes.cjs'
      - 'scripts/lib/gate6-precondition-freeze.cjs'
      - 'scripts/lib/gate6-taskset.cjs'
      - 'tests/gate6/**'
      - '.github/workflows/gate6-task-preconditions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-repository:
    name: preconditions (${{ matrix.repository }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        repository:
          - ai/nanoid
          - sindresorhus/p-limit
          - lukeed/clsx
          - sindresorhus/yocto-queue
          - sindresorhus/p-map
          - sindresorhus/p-queue
          - chalk/chalk
          - tj/commander.js
          - motdotla/dotenv
          - sindresorhus/query-string
          - sindresorhus/escape-string-regexp
          - sindresorhus/is
          - sindresorhus/ky
          - sindresorhus/slugify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate runner syntax
        run: |
          node --check scripts/gate6-precondition-runner.cjs
          node --check scripts/lib/gate6-precondition-probes.cjs
          node --check scripts/lib/gate6-precondition-freeze.cjs
      - name: Execute exact-SHA preconditions
        run: |
          safe_name="${{ matrix.repository }}"
          safe_name="${safe_name//\//__}"
          node scripts/gate6-precondition-runner.cjs \
            --repository '${{ matrix.repository }}' \
            --output "evidence/gate6/preconditions/${safe_name}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate6-precondition-${{ strategy.job-index }}
          path: evidence/gate6/preconditions/*.json
          if-no-files-found: warn
