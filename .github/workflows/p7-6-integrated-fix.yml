name: P7.6 One-shot Offline Integration

on:
  push:
    branches:
      - product/p7-6-integrated-review
    paths:
      - .github/workflows/p7-6-integrated-fix.yml

permissions:
  contents: write

jobs:
  guarded-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEX_API_KEY: ""
      OPENAI_API_KEY: ""
      CODEX_ACCESS_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: product/p7-6-integrated-review
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply guarded, narrow P7.6 source fixes
        run: node scripts/product/p7-6-integrated-patch.cjs
      - name: Offline typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Offline P7.6 regression tests (no real provider calls)
        run: |
          node benchmarks/product-v1/dogfood-provider-budget-smoke.cjs
          node benchmarks/product-v1/dogfood-auth-preflight-smoke.cjs
          node benchmarks/product-v1/p7-6-first-access-budget-smoke.cjs
          node scripts/smoke/codex-event-parser-smoke.cjs
          node scripts/smoke/bounded-compare-codex-smoke.cjs
          node benchmarks/product-v1/dogfood-smoke.cjs
      - name: Commit only verified sources; self-remove the one-shot workflow
        run: |
          git add packages/integrations/src/codex-agent-adapter.ts apps/cli/src/commands/codex.ts apps/cli/src/commands/compare.ts .github/workflows/product-dogfood-v1-live.yml
          git rm -- .github/workflows/p7-6-integrated-fix.yml scripts/product/p7-6-integrated-patch.cjs
          git diff --cached --check
          git -c user.name='p7-6-offline-integration' -c user.email='98805835+theOguz16@users.noreply.github.com' commit -m 'fix(p7.6): enforce exact Luna none, fail-fast and single first-access invocation'
          git push origin HEAD:refs/heads/product/p7-6-integrated-review
