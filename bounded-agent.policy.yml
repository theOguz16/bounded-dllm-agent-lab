allowed_paths:
  - README.md
  - package.json
  - package-lock.json
  - action.yml
  - bounded-agent.policy.yml
  - apps/**
  - packages/**
  - tests/**
  - docs/**
  - examples/**
  - .github/**
  - scripts/controlled-coding-pilot.cjs
  - scripts/controlled-coding-pilot-smoke.cjs
  - scripts/controlled-coding-pilot-help-check.cjs
  - scripts/controlled-coding-pilot-evidence.cjs
  - scripts/controlled-coding-pilot-evidence-smoke.cjs
  - scripts/controlled-coding-pilot-evidence-verify.cjs
  - scripts/controlled-coding-pilot-evidence-verify-smoke.cjs
  - scripts/controlled-coding-pilot-acceptance.cjs
  - scripts/controlled-coding-pilot-acceptance-smoke.cjs
  - scripts/controlled-coding-pilot-acceptance-chain-smoke.cjs
  - scripts/runpod-controlled-pilot-bootstrap.sh
  - scripts/runpod-controlled-pilot-bootstrap-smoke.cjs
  - scripts/runpod-openai-compatible-model-client-error-smoke.cjs
  - pilots/controlled-real-coding-v1/**
forbidden_paths:
  - reports/**
  - benchmarks/repos/**
  - node_modules/**
  - dist/**
paired_files:
  - source: package.json
    requires: package-lock.json
    reason: npm package metadata changes must keep the lockfile in sync
  - source: action.yml
    requires: docs/MVP_USAGE.md
    reason: GitHub Action behavior changes must be documented for users
sensitive_patterns:
  - SECRET
  - API_KEY
  - TOKEN
  - PASSWORD
required_tests:
missing_authority_rules:
