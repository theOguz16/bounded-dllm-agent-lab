forbidden_paths:
  - reports/**
  - benchmarks/repos/**
  - node_modules/**
  - dist/**
paired_files:
  - source: package.json
    requires: package-lock.json
    reason: npm package metadata changes must keep the lockfile in sync
    changed_when_contains: "version, dependencies, devDependencies, optionalDependencies, peerDependencies, workspaces"
  - source: action.yml
    requires: docs/MVP_USAGE.md
    reason: GitHub Action behavior changes must be documented for users
sensitive_patterns:
  - SECRET
  - API_KEY
  - TOKEN
  - PASSWORD
sensitive_paths:
  - pattern: .env
    disposition: deny
  - pattern: "**/.env"
    disposition: deny
  - pattern: "**/*secret*"
    disposition: deny
ownership_rules: []